<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course Oversight — Techies LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/controls.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">

<body data-role="admin" data-route="admin.oversight" data-title="Course Oversight">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="app-main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <h1 class="page-title">Course Oversight</h1>
          <p class="page-sub">Every course on the platform, including drafts and submissions awaiting review.</p>
        </div>
        <span class="muted small" id="oversight-count"></span>
      </div>

      <div class="toolbar">
        <div class="pills" id="oversight-filter"></div>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="table">
            <thead>
              <tr><th>Course</th><th>Instructor</th><th>Status</th><th>Enrolled</th><th>Last updated</th><th></th></tr>
            </thead>
            <tbody id="oversight-rows"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<div id="overlays"></div>

<script src="assets/js/brand.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/icons.js"></script>
