<body data-role="public" data-route="courses" data-title="Courses">

<div class="site">
  <header class="site-nav" id="topnav"></header>

  <main class="site-main">
    <div class="rail" style="padding-top:40px;padding-bottom:64px">

      <div class="page-head">
        <div>
          <div class="eyebrow">Catalog</div>
          <h1 class="band-title">Browse courses</h1>
          <p class="band-sub">Video courses, quizzes and certificates from Malaysian instructors. Free and paid.</p>
        </div>
      </div>

      <div class="catalog">
        <aside id="catalog-filters"></aside>

        <div>
          <div class="toolbar">
            <div class="toolbar-grow" id="catalog-search-wrap"></div>
            <span class="muted small" id="catalog-count"></span>
          </div>
          <div id="catalog-grid"></div>
        </div>
      </div>

    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>
</div>

<div id="overlays"></div>

<script src="assets/js/brand.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  qs('#catalog-search-wrap').innerHTML =
    icon('search', 16, { stroke: 'var(--text-muted)' }) +
    '<input class="input input-search" id="catalog-search" placeholder="Search courses">';
});
</script>
