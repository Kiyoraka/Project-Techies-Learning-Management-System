<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Management — Techies LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/controls.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/screens.css">

<body data-role="instructor" data-route="inst.students" data-title="Student Management">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="app-main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <h1 class="page-title">Student Management</h1>
          <p class="page-sub">Progress and quiz averages for everyone enrolled in your courses.</p>
        </div>
        <button class="btn btn-secondary" data-toast="download">Export CSV</button>
      </div>

      <div class="toolbar">
        <select class="select" id="student-course" style="width:auto"></select>
        <span class="muted small" id="student-count"></span>
      </div>

      <div class="table-card">
        <div class="table-scroll">
          <table class="table">
            <thead>
              <tr><th>Student</th><th>Course</th><th>Progress</th><th>Last active</th><th>Quiz average</th><th></th></tr>
            </thead>
            <tbody id="student-rows"></tbody>
          </table>
        </div>
      </div>

    </main>
  </div>
</div>

<div id="overlays"></div>

<script src="assets/js/brand.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/instructor-students.js"></script>
