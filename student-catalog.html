<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse Catalog — Techies LMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/controls.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/screens-public.css">
<link rel="stylesheet" href="assets/css/screens-app.css">

<body data-role="student" data-route="stu.catalog" data-title="Browse Catalog">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="app-main">
    <header class="topbar" id="topbar"></header>
    <main class="content">

      <div class="page-head">
        <div>
          <h1 class="page-title">Browse Catalog</h1>
          <p class="page-sub">Every published course. Enrol and it appears under My Courses.</p>
        </div>
      </div>

      <div class="catalog">
        <aside id="catalog-filters"></aside>
        <div>
          <div class="toolbar">
            <div class="toolbar-grow" id="catalog-search-wrap"></div>
            <span class="muted small" id="catalog-count"></span>
          </div>
          <div id="catalog-grid"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<div id="overlays"></div>

<script src="assets/js/brand.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/pages/courses.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  qs('#catalog-search-wrap').innerHTML =
    icon('search', 16, { stroke: 'var(--text-muted)' }) +
    '<input class="input input-search" id="catalog-search" placeholder="Search courses">';
});
</script>
